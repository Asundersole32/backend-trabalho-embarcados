version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: dse_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: dse_user
      MYSQL_PASSWORD: dse_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file:
      - .env
    container_name: dse_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=dse_tenda
      - DB_USER=root
      - DB_PASSWORD=root123
      - MQTT_BROKER=broker.hivemq.com
      - MQTT_PORT=1883
      - DEBUG=1
    volumes:
      - .:/app
    command: []  # entrypoint já trata tudo

volumes:
  mysql_data: